name: Playwright Automation Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      testSuite:
        description: "Select test suite"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - master_suite

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ============================================================
  # TEST JOB
  # ============================================================
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright Browsers
        run: |
          mvn exec:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps"

      - name: Run Tests
        run: |
          mvn clean test \
            -DtestSuite=${{ inputs.testSuite || 'smoke' }} \
            -Dheadless=true

      # These steps execute even when tests fail
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports


  # ============================================================
  # ALLURE REPORT + GITHUB PAGES
  # ============================================================
  deploy:

    runs-on: ubuntu-latest

    needs: test

    # Run this job even if the test job failed
    if: always()

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Generate Allure Report
        run: |
          curl -o allure.tgz -OLs https://github.com/allure-framework/allure2/releases/download/2.35.1/allure-2.35.1.tgz
          tar -zxvf allure.tgz
          ./allure-2.35.1/bin/allure generate \
            target/allure-results \
            --clean \
            -o target/allure-report

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Allure Report
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/allure-report

      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4